# Run everything with one command:
#
#   cp .env.example .env        (optional: AI keys, Telegram token; everything works without them)
#   docker compose up --build
#
# Then open http://localhost:8000/pages/concept-with-navigation.html  (Savanna page with Mimi)
#       and http://localhost:8000/demo/blank.html                    (Mimi on a plain page)
#
# Another port: MIMI_PORT=9000 docker compose up   (then set PUBLIC_BASE_URL=http://localhost:9000)

services:
  mimi:
    build: .
    ports:
      - "${MIMI_PORT:-8000}:8000"
    env_file:
      - path: ../.env        # settings kept outside the project (and outside git)
        required: false
      - path: .env
        required: false
    environment:
      PUBLIC_BASE_URL: http://localhost:${MIMI_PORT:-8000}
      CHANNELS_DB_PATH: /app/state/channels.db
      ACCOMMODATIONS_DB_PATH: /app/state/accommodations.db
    volumes:
      - state:/app/state
      - voice-clips:/app/data/tts_cache
    # Restarted if it stops. The health check asks /api/health, which fails (503) when the help desk
    # cannot take learners; `docker ps` then shows "unhealthy".
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  state: # tickets, job-alert subscriptions, the anonymous question log, accommodation requests
  voice-clips: # recorded fixed phrases, so they play with no voice quota
