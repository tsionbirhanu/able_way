<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor console - sign in</title>
{% include "_p34_style.html" %}
</head>
<body>
<main>
<h1>Tutor console</h1>
{% if error %}<p class="box error" role="alert">Wrong password.</p>{% endif %}
<form method="post" action="/handoff/console/login">
  <label for="password">Tutor password</label>
  <input type="password" id="password" name="password" required autocomplete="current-password">
  <div><button type="submit">Sign in</button></div>
</form>
</main>
</body>
</html>
