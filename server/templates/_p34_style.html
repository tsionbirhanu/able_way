<style>
body{font:1rem/1.5 system-ui,"Noto Sans Ethiopic","Nyala",sans-serif;max-width:42rem;margin:0 auto;padding:1rem;color:#111;background:#fff}
h1{font-size:1.4rem}h2{font-size:1.1rem}
label{display:block;font-weight:600;margin:.8rem 0 .2rem}
input,select,textarea,button{font:inherit;padding:.5rem;border:2px solid #333;border-radius:4px;max-width:100%;box-sizing:border-box}
textarea,input[type=text],input[type=password]{width:100%}
button{background:#0b3d91;color:#fff;border-color:#0b3d91;cursor:pointer;margin-top:.8rem}
button.secondary{background:#fff;color:#0b3d91}
a{color:#0b3d91}
:focus-visible{outline:3px solid #d9480f;outline-offset:2px}
.box{border:1px solid #999;border-radius:4px;padding:.8rem;margin:1rem 0}
.error{border-color:#b00020;color:#b00020}
.note{color:#444;font-size:.9rem}
.skip{position:absolute;left:-999px}.skip:focus{position:static}

</style>
