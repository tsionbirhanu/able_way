services:
  # One web service: the pages and Mimi, the AI, voice, talk to a person, Telegram, SMS and /lite.
  - type: web
    name: mimi
    runtime: python
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: ABLEWAY_PROVIDERS
        value: gemini,offline
      - key: ABLEWAY_GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false          # paste in the Render dashboard
      # This service's own address, e.g. https://mimi.onrender.com (no slash at the end): used in the
      # links the help chat, Telegram and SMS send out, and for the Telegram webhook.
      - key: PUBLIC_BASE_URL
        sync: false
      # A random password made by Render (see the Environment tab). Never a fixed one in git.
      - key: TUTOR_PASSWORD
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # a bot made for the hosted server, not the one on your laptop
      # Telegram sends each message to this server, which also wakes it when the free plan put it to sleep.
      - key: TELEGRAM_MODE
        value: webhook
      - key: ALERTS_INTERVAL_MINUTES
        value: "3"
      - key: CHANNELS_DB_PATH
        value: data/channels.db
      - key: ACCOMMODATIONS_DB_PATH
        value: data/accommodations.db
